# Task 110b — PERMANENT release signing key for the 3 Boxes HRMS Android app.
#
# WHY COMMITTED: the build sandbox gets reset regularly; every previous APK
# was signed with whatever ~/.android/debug.keystore the sandbox generated,
# so each rebuild had a DIFFERENT signature and users could never install an
# update over their existing app (Android refuses signature-mismatched
# upgrades — "App not installed" — so their device silently kept the old
# erroring build). A committed keystore makes every future build
# signature-stable; only this ONE-TIME migration (v1.0.9) needs an uninstall
# of the old app first.
storeFile=app/release-key.jks
