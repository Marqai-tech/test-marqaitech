# ============================================================
# Nginx Configuration for 3Boxes HRMS on Hostinger VPS
# ============================================================
# Place this file at /etc/nginx/sites-available/3boxeshrms.com
# Then: sudo ln -s /etc/nginx/sites-available/3boxeshrms.com /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Rate limiting zone for login protection
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream to Next.js app (PM2 cluster on port 3000)
upstream nextjs_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTP → HTTPS Redirect ───
server {
    listen 80;
    listen [::]:80;
    server_name 3boxeshrms.com *.3boxeshrms.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main Domain: 3boxeshrms.com ───
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3boxeshrms.com;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/3boxeshrms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3boxeshrms.com/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (uncomment after confirming HTTPS works)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains
# ============================================================

# Upstream to Next.js app running on PM2
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTP → HTTPS redirect (all domains) ───
server {
    listen 80;
    listen [::]:80;
    server_name 3boxeshrms.com *.3boxeshrms.com;
    return 301 https://$host$request_uri;
}

# ─── Main domain: 3boxeshrms.com ───
# Super admin login / management portal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3boxeshrms.com;

    # SSL certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/3boxeshrms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3boxeshrms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to Next.js
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Static assets caching
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Access and error logs
    access_log /var/log/nginx/3boxeshrms_access.log;
    error_log /var/log/nginx/3boxeshrms_error.log;
}

# ─── Wildcard subdomain: *.3boxeshrms.com ───
# Tenant-specific portals (e.g., marqaitechgroup.3boxeshrms.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.3boxeshrms.com;

    # Wildcard SSL certificate (Let's Encrypt with DNS challenge)
    ssl_certificate /etc/letsencrypt/live/3boxeshrms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3boxeshrms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to Next.js (same app, middleware resolves tenant from subdomain)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Static assets caching
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Access and error logs (per-subdomain logging)
    access_log /var/log/nginx/3boxeshrms_wildcard_access.log;
    error_log /var/log/nginx/3boxeshrms_wildcard_error.log;
}
